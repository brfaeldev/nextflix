<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Séries | Nextflix</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="home-body">

    <header class="navbar">

        <div class="navbar-left">

            <h1 class="logo">
                <a href="./home.html">Nextflix</a>
            </h1>

            <nav class="nav-links">
                <a href="./home.html" data-nav="inicio">Início</a>
                <a href="./series.html" data-nav="series">Séries</a>
                <a href="./home.html#catalogo" data-nav="filmes">Filmes</a>
                <a href="./minha-lista.html" data-nav="lista">Minha Lista</a>
            </nav>

        </div>

        <div class="navbar-right">
            <div class="navbar-search">
                <input
                    type="search"
                    id="movie-search"
                    placeholder="Buscar filme..."
                    autocomplete="off"
                >
                <div id="search-results" class="search-results" hidden></div>
            </div>

            <button class="profile-btn" type="button" id="profile-btn">
                Perfil
            </button>
        </div>

    </header>

    <main class="page-section coming-soon">
        <h2>Séries em breve</h2>
        <p>
            O catálogo atual usa o dataset MovieLens, que contém apenas filmes.
            A recomendação por IA também foi treinada nesse conjunto.
        </p>
        <p>
            <a href="./home.html#catalogo">Ver catálogo de filmes</a>
        </p>
    </main>

    <script type="module" src="./js/pages/series.js"></script>

</body>
</html>
