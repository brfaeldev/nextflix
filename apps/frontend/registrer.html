<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Nextflix</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-box">

            <h1 class="login-logo">
                Nextflix
            </h1>

            <h2>
                Criar Conta
            </h2>

            <form class="login-form">

                <input
                    type="text"
                    placeholder="Nome"
                    required
                >

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Senha"
                    required
                >

                <input
                    type="password"
                    placeholder="Confirmar senha"
                    required
                >

                <button type="submit">
                    Criar Conta
                </button>

            </form>

            <div class="register-link">

                <p>
                    Já possui conta?
                    <a href="./login.html">
                        Entrar
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="./js/pages/registrer.js"></script>

</body>
</html>
