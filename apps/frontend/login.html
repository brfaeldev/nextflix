<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nextflix</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-box">

            <h1 class="login-logo">
                Nextflix
            </h1>

            <h2>
                Entrar
            </h2>

            <form class="login-form">

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <div class="login-options">

                <label>
                    <input type="checkbox">
                    Lembre-se de mim
                </label>

                <a href="#">
                    Precisa de ajuda?
                </a>

            </div>

            <div class="register-link">

                <p>
                    Novo por aqui?
                    <a href="./registrer.html">
                        Cadastre-se agora
                    </a>
                </p>

            </div>

        </section>

    </main>

    <script type="module" src="./js/pages/login.js"></script>

</body>
</html>
