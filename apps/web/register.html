<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta Nextflix.">
    <title>Cadastro | Nextflix</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="page-auth">

    <main class="auth-card" aria-labelledby="register-title">
        <a href="index.html" class="auth-card__logo">Nextflix</a>

        <h1 id="register-title" class="auth-card__title">Criar conta</h1>

        <form id="register-form" class="auth-form" novalidate>
            <label class="visually-hidden" for="register-name">Nome</label>
            <input
                id="register-name"
                class="field"
                type="text"
                name="name"
                placeholder="Nome"
                required
                autocomplete="name"
            >

            <label class="visually-hidden" for="register-email">Email</label>
            <input
                id="register-email"
                class="field"
                type="email"
                name="email"
                placeholder="Email"
                required
                autocomplete="email"
            >

            <label class="visually-hidden" for="register-password">Senha</label>
            <input
                id="register-password"
                class="field"
                type="password"
                name="password"
                placeholder="Senha"
                required
                autocomplete="new-password"
                minlength="6"
            >

            <label class="visually-hidden" for="register-password-confirm">Confirmar senha</label>
            <input
                id="register-password-confirm"
                class="field"
                type="password"
                name="passwordConfirm"
                placeholder="Confirmar senha"
                required
                autocomplete="new-password"
                minlength="6"
            >

            <p id="register-error" class="auth-form__error message message--error" hidden></p>

            <button type="submit" class="btn btn--primary">Criar conta</button>
        </form>

        <p class="auth-footer">
            Já possui conta?
            <a href="login.html">Entrar</a>
        </p>
    </main>

    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
