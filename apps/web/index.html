<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nextflix — filmes, séries e recomendações personalizadas.">
    <title>Nextflix | O seu próximo filme está aqui</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/landing.css">
</head>
<body class="page-landing">

    <header class="site-header">
        <a href="index.html" class="site-logo">Nextflix</a>
        <nav aria-label="Principal">
            <a href="login.html" class="btn btn--primary btn--header">Entrar</a>
        </nav>
    </header>

    <main>
        <section class="landing-hero" aria-labelledby="hero-title">
            <h1 id="hero-title" class="landing-hero__title">
                Filmes, séries e recomendações feitas sob medida para você.
            </h1>
            <p class="landing-hero__subtitle">
                Assista onde quiser. Cancele quando quiser.
            </p>
            <form id="cta-form" class="landing-cta" action="register.html" method="get">
                <label class="visually-hidden" for="cta-email">Email</label>
                <input
                    id="cta-email"
                    class="field field--light"
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                    autocomplete="email"
                >
                <button type="submit" class="btn btn--primary">Vamos lá</button>
            </form>
        </section>

        <section class="landing-trending" aria-labelledby="trending-title">
            <h2 id="trending-title" class="landing-trending__title">Em alta agora</h2>
            <p id="trending-status" class="landing-trending__status message message--info" hidden>
                Carregando filmes…
            </p>
            <div class="movies-row" id="trending-row"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Nextflix. Todos os direitos reservados.</p>
    </footer>

    <script type="module" src="js/pages/landing.js"></script>
</body>
</html>
