<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nextflix</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="home-body">

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="navbar-left">

            <h1 class="logo">
                Nextflix
            </h1>

            <nav class="nav-links">

                <a href="#">Início</a>
                <a href="#">Séries</a>
                <a href="#">Filmes</a>
                <a href="#">Minha Lista</a>

            </nav>

        </div>

        <div class="navbar-right">

            <button class="profile-btn">
                Perfil
            </button>

        </div>

    </header>

    <!-- HERO -->
    <section class="hero-banner">

        <div class="hero-overlay">

            <div class="hero-content">

                <h2>
                    Interestelar
                </h2>

                <p>
                    Um grupo de exploradores viaja através de um buraco de minhoca no espaço
                    na tentativa de garantir a sobrevivência da humanidade.
                </p>

                <div class="hero-buttons">

                    <button class="play-btn">
                        ▶ Assistir
                    </button>

                    <button class="info-btn">
                        Mais informações
                    </button>

                </div>

            </div>

        </div>

    </section>

    <!-- FILMES -->
    <main class="movies-section">

        <section class="movie-category">

            <h3>Populares</h3>

            <div class="movies-row">

               <div class="movie-card">

    <img
        src="https://image.tmdb.org/t/p/w500/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg"
        alt="Interestelar"
    >

    <p>Interestelar</p>

</div>
                <div class="movie-card">

    <img
        src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg"
        alt="Batman"
    >

    <p>Batman</p>

</div>
                <div class="movie-card"></div>
                <div class="movie-card"></div>
                <div class="movie-card"></div>

            </div>

        </section>

        <section class="movie-category">

            <h3>Em alta</h3>

            <div class="movies-row">

                <div class="movie-card"></div>
                <div class="movie-card"></div>
                <div class="movie-card"></div>
                <div class="movie-card"></div>
                <div class="movie-card"></div>

            </div>

        </section>

    </main>

    <script type="module" src="./js/pages/home.js"></script>

</body>
</html>
